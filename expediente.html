<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expediente clínico — Dr. Miguel Soto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#030707; --taupe:#A19487; --crema:#F4F2F1;
  --linea:#DED9D4; --gris:#8C867F; --verde:#2F5A3E; --rojo:#8A2F27; --ambar:#8A6D1F;
  --sans:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:var(--sans);background:var(--crema);color:var(--negro);font-size:15px;line-height:1.5}
.oculto{display:none !important}

/* ---------- entrada ---------- */
.portada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.portada .caja{max-width:420px;width:100%;text-align:center}
.portada img.marca{width:260px;max-width:78%;height:auto;margin:0 auto 34px;display:block}
.portada .rotulo{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--taupe);margin-bottom:30px}
.portada .rotulo:before,.portada .rotulo:after{content:'';display:inline-block;
  width:26px;height:1px;background:var(--linea);vertical-align:middle;margin:0 12px}
.portada .gbtn{display:flex;justify-content:center;min-height:44px}
.portada .pie{margin-top:34px;font-size:11.5px;color:var(--taupe);line-height:1.7}
.portada .err{margin-top:18px;font-size:13px;color:var(--rojo)}

/* ---------- barra ---------- */
.barra{position:sticky;top:0;z-index:20;background:rgba(244,242,241,.96);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--linea)}
.barra .dentro{max-width:860px;margin:0 auto;padding:11px 18px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.barra img.marca{height:26px;width:auto;opacity:.9}
.barra .div{width:1px;height:22px;background:var(--linea)}
@media(max-width:700px){.barra img.marca,.barra .div{display:none}}
.barra h1{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;flex:1;min-width:150px}
.barra .quien{font-size:12px;color:var(--gris)}
.barra button.txt{border:none;background:none;color:var(--gris);font-size:12px;
  cursor:pointer;font-family:var(--sans);text-decoration:underline;padding:2px}
.alcance{display:flex;gap:5px}
.alcance button{padding:6px 12px;font-size:12px;border:1px solid var(--linea);
  background:#fff;color:var(--gris);border-radius:3px;cursor:pointer;font-family:var(--sans)}
.alcance button.on{background:var(--negro);color:var(--crema);border-color:var(--negro)}
.progreso{height:3px;background:var(--linea)}
.progreso i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}

.wrap{max-width:860px;margin:0 auto;padding:20px 18px 120px}

/* ---------- agenda y búsqueda ---------- */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{padding:9px 16px;font-size:13.5px;border:1px solid var(--linea);
  background:#fff;color:var(--gris);border-radius:3px;cursor:pointer;font-family:var(--sans)}
.tabs button.on{background:var(--negro);color:var(--crema);border-color:var(--negro)}
.cita{background:#fff;border:1px solid var(--linea);border-radius:4px;padding:13px 15px;
  margin-bottom:9px;display:flex;gap:14px;align-items:center;cursor:pointer}
.cita:hover{border-color:var(--taupe)}
.cita .hora{font-family:var(--serif);font-size:19px;min-width:58px}
.cita .med{flex:1;min-width:0}
.cita .nom{font-weight:500}
.cita .det{font-size:12.5px;color:var(--gris);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cita .sello{font-size:11px;padding:3px 8px;border-radius:2px;background:var(--crema);color:var(--gris)}
.cita .sello.ok{background:#E8F0EA;color:var(--verde)}
.cita .sello.no{background:#F6E9E8;color:var(--rojo)}
.cita.cancelada{opacity:.5}
.vacio{background:#fff;border:1px dashed var(--linea);border-radius:4px;
  padding:26px 18px;text-align:center;color:var(--gris);font-size:13.5px}

/* ---------- menú de documentos ---------- */
.fichaPac{background:#fff;border:1px solid var(--linea);border-radius:4px;
  padding:14px 16px;margin-bottom:16px}
.fichaPac h2{font-family:var(--serif);font-size:23px;font-weight:600;margin:0 0 3px}
.fichaPac .det{font-size:13px;color:var(--gris)}
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;
  margin-bottom:8px}
.ficha{background:#fff;border:1px solid var(--linea);border-radius:4px;padding:14px;
  cursor:pointer;text-align:left;font-family:var(--sans);color:var(--negro);
  display:flex;flex-direction:column;gap:7px;min-height:104px}
.ficha:hover{border-color:var(--negro)}
.ficha svg{width:24px;height:24px;stroke:var(--taupe);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.ficha:hover svg{stroke:var(--negro)}
.ficha .n{font-size:14px;font-weight:500;line-height:1.3}
.ficha .c{font-size:11.5px;color:var(--gris);margin-top:auto}
.ficha.hecho{background:var(--crema)}
.ficha.hecho svg{stroke:var(--verde)}
.hecho-fila{background:#fff;border:1px solid var(--linea);border-left:3px solid var(--verde);
  border-radius:3px;padding:11px 14px;margin-bottom:8px;display:flex;gap:12px;
  align-items:center;cursor:pointer;font-size:13.5px}
.hecho-fila:hover{border-color:var(--taupe);border-left-color:var(--verde)}
.hecho-fila .t{flex:1}
.hecho-fila .f{font-size:12px;color:var(--gris)}
.hecho-fila .sello{font-size:11px;padding:3px 8px;border-radius:2px;
  background:#E8F0EA;color:var(--verde)}
.previo{background:#fff;border:1px solid var(--linea);border-radius:4px;margin-bottom:12px}
.previo > summary{list-style:none;cursor:pointer;padding:13px 18px;font-weight:500;
  display:flex;gap:10px;align-items:center}
.previo > summary::-webkit-details-marker{display:none}
.previo .flecha{color:var(--taupe);font-size:12px}
.previo[open] .flecha{transform:rotate(90deg)}
.previo .cuerpo{padding:0 18px 16px}
.previo .par{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--linea);font-size:13px}
.previo .par .e{color:var(--gris);min-width:170px;font-size:11px;
  letter-spacing:.5px;text-transform:uppercase;padding-top:2px}
.previo .par .v{flex:1}

/* ---------- formulario ---------- */
.grupo{background:#fff;border:1px solid var(--linea);border-radius:4px;margin-bottom:12px;overflow:hidden}
.grupo > summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;
  gap:12px;align-items:center;font-weight:500}
.grupo > summary::-webkit-details-marker{display:none}
.grupo > summary:hover{background:var(--crema)}
.grupo .flecha{color:var(--taupe);font-size:12px;transition:transform .15s}
.grupo[open] .flecha{transform:rotate(90deg)}
.grupo .titulo{flex:1}
.grupo .conteo{font-size:11.5px;color:var(--gris);font-weight:400}
.grupo .cuerpo{padding:4px 18px 18px}

.campo{margin-bottom:14px}
.campo label{display:block;font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  color:var(--gris);margin-bottom:4px}
.campo label b{color:var(--rojo);font-weight:400}
input,textarea,select{width:100%;border:1px solid var(--linea);border-radius:3px;
  padding:10px 11px;font-family:var(--sans);font-size:16px;background:#fff;color:var(--negro)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--taupe)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
input[readonly]{background:var(--crema);color:var(--gris)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.dos{grid-template-columns:1fr}}

.sino{display:flex;gap:8px}
.sino button{flex:0 0 auto;padding:9px 20px;font-size:14px;border:1px solid var(--linea);
  background:#fff;color:var(--gris);border-radius:3px;cursor:pointer;font-family:var(--sans)}
.sino button.on{background:var(--negro);color:var(--crema);border-color:var(--negro)}
.casillas{display:flex;flex-wrap:wrap;gap:7px}
.casillas span{padding:7px 13px;border:1px solid var(--linea);border-radius:3px;
  font-size:13.5px;cursor:pointer;background:#fff}
.casillas span.on{background:var(--negro);color:var(--crema);border-color:var(--negro)}

.nota{font-size:12px;color:var(--gris);margin-top:3px}
.pendiente{font-size:11px;color:var(--ambar);margin-top:3px}
.dictado{font-size:12.5px;color:var(--ambar);margin-top:5px;padding:7px 9px;
  background:#FDF8EC;border-left:2px solid var(--ambar);border-radius:2px}
.dictado b{font-weight:500}
.dictado button{margin-left:8px;font-size:11px;padding:2px 8px;border:1px solid var(--ambar);
  background:#fff;color:var(--ambar);border-radius:2px;cursor:pointer;font-family:var(--sans)}
.alerta{font-size:12px;color:var(--rojo);margin-top:4px}
.conducta{margin-top:9px;padding:11px 13px;background:var(--crema);
  border-left:3px solid var(--negro);border-radius:3px;font-size:13px}
.conducta b{display:block;font-family:var(--serif);font-size:17px;margin-bottom:3px}
.fijo{font-size:11px;color:var(--gris);margin-top:3px;font-style:italic}

.pie{position:fixed;left:0;right:0;bottom:0;background:rgba(244,242,241,.97);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);z-index:20}
.pie .dentro{max-width:860px;margin:0 auto;padding:11px 18px;display:flex;gap:9px;
  align-items:center;flex-wrap:wrap}
.pie .estado{flex:1;font-size:12.5px;color:var(--gris);min-width:140px}
button.p{background:var(--negro);color:var(--crema);border:1px solid var(--negro);
  border-radius:3px;padding:11px 20px;font-size:15px;cursor:pointer;font-family:var(--sans)}
button.s{background:#fff;color:var(--negro);border:1px solid var(--negro);
  border-radius:3px;padding:11px 20px;font-size:15px;cursor:pointer;font-family:var(--sans)}
button:disabled{opacity:.4;cursor:not-allowed}

.aviso{background:#fff;border:1px solid var(--linea);border-left:3px solid var(--taupe);
  border-radius:3px;padding:12px 14px;font-size:13px;color:var(--gris);margin-bottom:14px}
.aviso b{color:var(--negro);font-weight:500}
.aviso.malo{border-left-color:var(--rojo);color:var(--rojo)}

/* ---------- capa ---------- */
.capa{position:fixed;inset:0;z-index:40;background:rgba(3,7,7,.45);
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.capa{align-items:center}}
.tarjeta{background:var(--crema);width:100%;max-width:760px;max-height:92vh;overflow:auto;
  border-radius:6px 6px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
@media(min-width:700px){.tarjeta{border-radius:6px}}
.tarjeta .cab{position:sticky;top:0;background:var(--crema);padding:16px 20px 12px;
  border-bottom:1px solid var(--linea);display:flex;gap:12px;align-items:center}
.tarjeta .cab h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;flex:1}
.tarjeta .cab button.x{border:none;background:none;font-size:22px;color:var(--gris);
  cursor:pointer;line-height:1;padding:0 4px}
.tarjeta .cuerpoc{padding:18px 20px 22px}
.tarjeta .piec{position:sticky;bottom:0;background:var(--crema);border-top:1px solid var(--linea);
  padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tarjeta .piec .info{flex:1;font-size:12.5px;color:var(--gris);min-width:130px}

.consent{background:#fff;border:1px solid var(--linea);border-left:3px solid var(--rojo);
  border-radius:3px;padding:14px 16px;font-size:13.5px;margin-bottom:16px}
.consent label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin-top:10px}
.consent input[type=checkbox]{width:18px;height:18px;flex:0 0 auto;margin-top:1px}

.medidor{height:8px;background:var(--linea);border-radius:4px;overflow:hidden;margin:14px 0 6px}
.medidor i{display:block;height:100%;width:0;background:var(--verde);transition:width .08s}
.reloj{font-family:var(--serif);font-size:38px;text-align:center;margin:6px 0 2px}
.subreloj{text-align:center;font-size:12.5px;color:var(--gris)}

.fila{background:#fff;border:1px solid var(--linea);border-radius:3px;padding:12px 14px;margin-bottom:10px}
.fila.descartada{opacity:.45}
.fila .qcampo{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--gris)}
.fila .qgrupo{font-size:11px;color:var(--taupe);margin-bottom:6px}
.fila .qdictado{font-size:14px;margin:4px 0}
.fila .qactual{font-size:12.5px;color:var(--gris);margin:4px 0;padding-left:9px;border-left:2px solid var(--linea)}
.fila .qnota{font-size:12px;color:var(--ambar);margin-top:5px}
.fila .ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.fila .ops button{padding:6px 12px;font-size:12.5px;border:1px solid var(--linea);
  background:var(--crema);color:var(--gris);border-radius:3px;cursor:pointer;font-family:var(--sans)}
.fila .ops button.on{background:var(--negro);color:var(--crema);border-color:var(--negro)}
.seccion{font-family:var(--serif);font-size:18px;margin:20px 0 10px}
.seccion:first-child{margin-top:0}
.lista{font-size:13px;color:var(--gris);background:#fff;border:1px solid var(--linea);
  border-radius:3px;padding:12px 14px}
.lista div{margin-bottom:4px}
pre.tx{white-space:pre-wrap;font-family:var(--sans);font-size:13px;color:var(--gris);
  background:#fff;border:1px solid var(--linea);border-radius:3px;padding:12px 14px;margin:0}
</style>
</head>
<body>

<!-- ===================== entrada ===================== -->
<div class="portada" id="portada">
  <div class="caja">
    <img class="marca" src="ms-vertical.png" alt="Dr. Miguel Soto">
    <div class="rotulo">Expediente clínico</div>
    <div class="gbtn" id="gbtn"></div>
    <div class="err oculto" id="errLogin"></div>
    <div class="pie">
      Solo las cuentas autorizadas pueden abrir expedientes.<br>
      Los datos viven en el repositorio del consultorio, no en este navegador.
    </div>
  </div>
</div>

<!-- ===================== aplicación ===================== -->
<div class="oculto" id="app">

  <div class="barra">
    <div class="dentro">
      <img class="marca" src="ms-horizontal.png" alt="Dr. Miguel Soto">
      <div class="div"></div>
      <h1 id="titulo">Pacientes de hoy</h1>
      <div class="quien" id="quien"></div>
      <button class="txt" id="bVolver" style="display:none">← Atrás</button>
      <div class="alcance oculto" id="cajaAlcance">
        <button id="modoTodo" class="on">Todo el documento</button>
        <button id="modoValoracion">Solo lo que falta</button>
      </div>
      <button class="txt" id="bSalir">Salir</button>
    </div>
    <div class="progreso"><i id="progreso"></i></div>
  </div>

  <!-- pantalla: agenda / búsqueda -->
  <div class="wrap" id="pantallaLista">
    <div class="tabs">
      <button id="tabAgenda" class="on">Agenda de hoy</button>
      <button id="tabBuscar">Buscar paciente</button>
    </div>

    <div id="cajaAgenda">
      <div class="campo" style="max-width:220px">
        <label for="fechaAgenda">Día</label>
        <input type="date" id="fechaAgenda">
      </div>
      <div id="listaAgenda"><div class="vacio">Cargando la agenda…</div></div>
    </div>

    <div id="cajaBuscar" class="oculto">
      <div class="campo">
        <label for="q">Nombre, teléfono o ID de la paciente</label>
        <input type="text" id="q" placeholder="Escribe al menos dos letras" autocomplete="off">
      </div>
      <div id="listaBuscar"></div>
      <div class="campo" style="margin-top:22px">
        <label for="manual">¿No está en la base? Escribe el nombre completo</label>
        <input type="text" id="manual" placeholder="Nombres Apellido Apellido" autocomplete="off">
      </div>
      <button class="s" id="bManual">Abrir expediente con ese nombre</button>
    </div>
  </div>

  <!-- pantalla: qué documento vas a hacer -->
  <div class="wrap oculto" id="pantallaDocs">
    <div class="fichaPac" id="fichaPac"></div>
    <div id="yaHechos"></div>
    <div class="seccion">Capturar</div>
    <div class="mosaico" id="mosCaptura"></div>
    <div class="seccion">Imprimir y firmar</div>
    <div class="mosaico" id="mosFirmar"></div>
  </div>

  <!-- pantalla: expediente -->
  <div class="wrap oculto" id="pantallaExp">
    <div class="aviso" id="avisoPrefill"></div>
    <div id="formulario"></div>
  </div>

  <div class="pie oculto" id="pieExp">
    <div class="dentro">
      <div class="estado" id="estado">Cargando…</div>
      <button class="s" id="bDictar">Dictar</button>
      <button class="p" id="bGuardar">Guardar</button>
    </div>
  </div>
</div>

<!-- ===================== capa del dictado ===================== -->
<div class="capa oculto" id="capa">
  <div class="tarjeta">
    <div class="cab">
      <h2 id="capaTitulo">Dictar el interrogatorio</h2>
      <button class="x" id="capaCerrar" title="Cerrar">×</button>
    </div>
    <div class="cuerpoc" id="capaCuerpo"></div>
    <div class="piec">
      <div class="info" id="capaInfo"></div>
      <button class="s oculto" id="capaSec"></button>
      <button class="p" id="capaPri">Empezar</button>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================
   CONFIGURACIÓN — lo único que se cambia si cambia el gateway
   ============================================================ */
var GATEWAY = 'https://script.google.com/macros/s/AKfycbwOIrs7KH3NwCUtbZdxABD0T_8oVzOvuocosl2odkFOnhUGqPOnnedRE_TkcF_yWuOgxA/exec';
/* El cliente del ecosistema: el mismo de agenda, crm, vista360, recall, bandeja
   y almacén. Vive en el proyecto "BA App Dr Miguel Soto", que es el que el Dr.
   sí administra. (ba.miguelsotomd.com usa otro, el del Cotizador, en un proyecto
   de otra cuenta: por eso no sirve para esto.)
   Este mismo valor tiene que estar en la propiedad CLIENT_ID del gateway. */
var CLIENT_ID = '634352012698-b47t3ed3tvd4d1g7l30l68bd6e5s0ri4.apps.googleusercontent.com';

var $ = function(id){ return document.getElementById(id); };

/* ============================================================
   IDENTIDAD
   ============================================================ */
var CRED = null, CORREO = '';

function onCredential(r){
  CRED = r.credential;
  try{ sessionStorage.setItem('cred', CRED); }catch(e){}
  entra();
}

function pintaBotonGoogle(){
  if (!window.google || !google.accounts || !google.accounts.id) return false;
  google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential,
                                  auto_select: true, cancel_on_tap_outside: false });
  google.accounts.id.renderButton($('gbtn'),
    { theme:'outline', size:'large', text:'signin_with', locale:'es', width:280 });
  google.accounts.id.prompt();
  return true;
}

function esperaGoogle(){
  if (pintaBotonGoogle()) return;
  if (esperaGoogle.veces === undefined) esperaGoogle.veces = 0;
  if (++esperaGoogle.veces > 40){
    $('errLogin').classList.remove('oculto');
    $('errLogin').textContent =
      'No cargó el acceso de Google. Revisa tu conexión y recarga la página.';
    return;
  }
  setTimeout(esperaGoogle, 250);
}

function salir(){
  CRED = null;
  try{ sessionStorage.removeItem('cred'); }catch(e){}
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  location.reload();
}

function sesionCaida(mensaje){
  guardaBorrador();
  $('app').classList.add('oculto');
  $('portada').classList.remove('oculto');
  $('errLogin').classList.remove('oculto');
  $('errLogin').textContent = mensaje +
    ' Lo que llevabas capturado quedó guardado en este navegador y se recupera al volver a entrar.';
  CRED = null;
  try{ sessionStorage.removeItem('cred'); }catch(e){}
  esperaGoogle();
}

/* ============================================================
   TRANSPORTE
   Se manda el JSON como cuerpo sin encabezado propio: así el
   navegador lo trata como petición simple y no hay preflight,
   que Apps Script no sabe contestar.
   ============================================================ */
function pide(accion, datos){
  var cuerpo = { accion: accion, credential: CRED };
  if (datos) for (var k in datos) if (datos.hasOwnProperty(k)) cuerpo[k] = datos[k];
  return fetch(GATEWAY, { method:'POST', body: JSON.stringify(cuerpo) })
    .then(function(r){ return r.text(); })
    .then(function(t){
      var d;
      try{ d = JSON.parse(t); }
      catch(e){ throw new Error('El servidor contestó algo que no entiendo.'); }
      if (d && d.error){
        if (/sesión|sesion|identificarse|expiró|expiro/i.test(d.error)){
          sesionCaida(d.error);
          throw new Error(d.error);
        }
        throw new Error(d.error);
      }
      return d;
    });
}

function docPorId(id){
  return DOCUMENTOS.filter(function(d){ return d.id === id; })[0] || null;
}

/* Los campos que le tocan a un documento: los suyos más los que aparecen en
   todos los formatos (tu nombre, cédulas, folio…), que casi siempre ya están
   llenos solos. */
function camposDe(tipo){
  if (!ESQUEMA) return [];
  var etiquetas = tipo.etiquetas.concat([SIEMPRE]);
  return ESQUEMA.campos.filter(function(c){
    var suyas = String(c.aparece || '').replace(/;/g, ',').split(',')
      .map(function(x){ return x.trim(); });
    return suyas.some(function(x){ return etiquetas.indexOf(x) >= 0; });
  });
}

/* Cuántos campos le faltarían de verdad: sin contar los automáticos, los que
   son constantes del consultorio y los que ya traen valor. */
function faltanDe(tipo, valores){
  return camposDe(tipo).filter(function(c){
    if (c.control === 'automatico') return false;
    if (CONSTANTES.hasOwnProperty(c.id)) return false;
    return !(valores && valores[c.id]);
  }).length;
}

function sinAcentos(s){
  return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function parteNombre(completo){
  var t = String(completo || '').trim().replace(/\s+/g,' ');
  if (!t) return null;
  var p = t.split(' ');
  if (p.length === 1) return { nombres:p[0], paterno:'', materno:'' };
  if (p.length === 2) return { nombres:p[0], paterno:p[1], materno:'' };
  return { nombres:p.slice(0, p.length-2).join(' '),
           paterno:p[p.length-2], materno:p[p.length-1] };
}

function aFechaISO(v){
  var t = String(v || '').trim();
  var m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return m[3] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[1]).slice(-2);
  if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  return '';
}

function hoyISO(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}

function folioDe(p){
  var base = (p['Paciente_ID'] || p['Paciente'] || 'sin-nombre')
    .toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50);
  return base + '_' + hoyISO();
}

function pintaDocumentos(){
  var docs = (EXPEDIENTE && EXPEDIENTE.documentos) || [];

  var f = $('fichaPac');
  f.innerHTML = '';
  var h = document.createElement('h2');
  h.textContent = PACIENTE['Paciente'] || 'Paciente';
  var d = document.createElement('div'); d.className = 'det';
  d.textContent = [
    PACIENTE['Edad'] ? PACIENTE['Edad'] + ' años' : '',
    PACIENTE['Procedimiento(s) de interés'] || '',
    docs.length ? docs.length + (docs.length === 1 ? ' documento' : ' documentos') : 'expediente nuevo'
  ].filter(Boolean).join('  ·  ');
  f.appendChild(h); f.appendChild(d);

  // lo que ya existe, para continuarlo en vez de duplicarlo
  var y = $('yaHechos');
  y.innerHTML = '';

    var orden = docs.slice().sort(function(a,b){
      return String(b.fecha || '').localeCompare(String(a.fecha || ''));
    });
    orden.forEach(function(doc){
      var t = docPorId(doc.tipo);
      var fila = document.createElement('div');
      fila.className = 'hecho-fila';
      var tx = document.createElement('div'); tx.className = 't';
      tx.textContent = (t ? t.nombre : doc.tipo);
      var fe = document.createElement('div'); fe.className = 'f';
      fe.textContent = doc.fecha || '';
      fila.appendChild(tx); fila.appendChild(fe);
      if (doc.firmado){
        var s = document.createElement('div'); s.className = 'sello';
        s.textContent = 'firmado'; fila.appendChild(s);
      }
      if (doc.dictado && !doc.revisado_dictado){
        var p = document.createElement('div'); p.className = 'sello';
        p.style.background = '#FDF8EC'; p.style.color = 'var(--ambar)';
        p.textContent = 'dictado por revisar'; fila.appendChild(p);
      }
      fila.onclick = function(){ abreDocumento(doc.tipo, doc.id); };
      y.appendChild(fila);
    });

  ['captura','firma'].forEach(function(g){
    var caja = $(g === 'captura' ? 'mosCaptura' : 'mosFirmar');
    caja.innerHTML = '';
    DOCUMENTOS.filter(function(t){ return t.grupo === g; }).forEach(function(t){
      var existente = docs.filter(function(x){ return x.tipo === t.id; })[0];
      var b = document.createElement('button');

      b.appendChild(n); b.appendChild(c);
      b.onclick = function(){
        abreDocumento(t.id, (existente && t.unico) ? existente.id : '');
      };
      caja.appendChild(b);
    });
  });
}

/* ---------------- paso 2: capturar ese documento ---------------- */
function abreDocumento(tipoId, docId){
  TIPO = docPorId(tipoId);
  if (!TIPO) return;
  DOC_ID = docId || '';

  VALORES = {}; PENDIENTE_DICTADO = {}; SIN_UBICAR = []; DUDAS = []; AVISOS_ASR = [];
  AUDIO_ID = ''; sucio = false;

  ocultaTodo();
  $('pantallaExp').classList.remove('oculto');
  $('pieExp').classList.remove('oculto');
  $('cajaAlcance').classList.remove('oculto');
  $('bVolver').style.display = '';
  $('titulo').textContent = TIPO.nombre;
  $('estado').textContent = '';
  $('avisoPrefill').className = 'aviso';
  $('avisoPrefill').textContent = '';
  $('formulario').innerHTML = '';
  $('bDictar').style.display = TIPO.dictado ? '' : 'none';
  window.scrollTo(0,0);

  var docs = (EXPEDIENTE && EXPEDIENTE.documentos) || [];
  var doc = DOC_ID ? docs.filter(function(x){ return x.id === DOC_ID; })[0] : null;
  var borrador = leeBorrador();

  if (doc){
    VALORES = doc.campos || {};
    PENDIENTE_DICTADO = doc.dictado_pendiente || {};
    SIN_UBICAR = doc.dictado_sin_ubicar || [];
    DUDAS = doc.dictado_dudas || [];
    AVISOS_ASR = doc.dictado_avisos || [];
    AUDIO_ID = doc.audio_id || '';
    dibujaTodo();
    $('avisoPrefill').innerHTML = '<b>' + TIPO.nombre + ' ya empezada.</b> Guardada el ' +
      (doc.guardado || '') + (doc.por ? ' por ' + doc.por : '') + '.';
    if (doc.firmado){
      $('avisoPrefill').className = 'aviso malo';
      $('avisoPrefill').innerHTML = '<b>Este documento ya está firmado.</b> No se edita: ' +
        'si hay que corregir o agregar algo, se hace en una nota nueva.';
    }
    if (doc.dictado && !doc.revisado_dictado){
      ofreceDictadoListo(doc.dictado, doc.transcripcion || '');
    }
  } else if (borrador && borrador.tipo === TIPO.id){
    VALORES = borrador.campos || {};
    PENDIENTE_DICTADO = borrador.dictado_pendiente || {};
    dibujaTodo();
    $('avisoPrefill').innerHTML = '<b>Se recuperó lo que habías capturado</b> en este ' +
      'navegador y que no alcanzó a guardarse. Revísalo y guarda.';
    sucio = true;
  } else {
    prellena();
    heredaDeHistoria();
    dibujaTodo();
  }
  muestraAntecedentes();
}

function dibujaTodo(){
  arma(); vuelca(); aplicaConstantes(); recalcula(); pinta();
}

/* Lo estable de la historia clínica —nombre, domicilio, alergias, antecedentes—
   no se vuelve a preguntar: se hereda.
   Lo de HOY no se hereda NUNCA. Los signos vitales, la exploración, el
   diagnóstico y el plan son los de esta consulta; heredarlos sería firmar como
   propio un hallazgo de otro día. */
var NO_SE_HEREDA = ['Exploración física', 'Cierre clínico'];

function heredaDeHistoria(){
  var docs = (EXPEDIENTE && EXPEDIENTE.documentos) || [];
  var hc = docs.filter(function(x){ return x.tipo === 'historia_clinica'; })[0];
  if (!hc || !hc.campos) return 0;
  var mios = {};
  camposDe(TIPO).forEach(function(c){
    if (NO_SE_HEREDA.indexOf(c.grupo) < 0) mios[c.id] = true;
  });
  var n = 0;
  Object.keys(hc.campos).forEach(function(id){
    if (mios[id] && !VALORES[id]){ VALORES[id] = hc.campos[id]; n++; }
  });
  return n;
}

/* En una nota de evolución quieres ver los antecedentes sin volver a teclearlos. */
function muestraAntecedentes(){
  var viejo = document.getElementById('panelPrevio');
  if (viejo) viejo.remove();
  if (!TIPO || TIPO.id === 'historia_clinica') return;

  var docs = (EXPEDIENTE && EXPEDIENTE.documentos) || [];
  var hc = docs.filter(function(x){ return x.tipo === 'historia_clinica'; })[0];
  if (!hc || !hc.campos) return;

  var mios = {};
  camposDe(TIPO).forEach(function(c){ mios[c.id] = true; });
  var filas = ESQUEMA.campos.filter(function(c){
    return hc.campos[c.id] && !mios[c.id] &&
           /Historia clínica|Riesgo|Cierre/.test(c.grupo);
  });
  if (!filas.length) return;

  var d = document.createElement('details');
  d.className = 'previo'; d.id = 'panelPrevio';
  var s = document.createElement('summary');
  var fl = document.createElement('span'); fl.className = 'flecha'; fl.textContent = '▸';
  var ti = document.createElement('span');
  ti.textContent = 'De su historia clínica del ' + (hc.fecha || '') +
                   '  ·  ' + filas.length + ' datos';
  s.appendChild(fl); s.appendChild(ti);
  d.appendChild(s);

  var cuerpo = document.createElement('div'); cuerpo.className = 'cuerpo';
  filas.forEach(function(c){
    var p = document.createElement('div'); p.className = 'par';
    var e = document.createElement('div'); e.className = 'e';
    e.textContent = c.etiqueta || c.id;
    var v = document.createElement('div'); v.className = 'v';
    v.textContent = hc.campos[c.id];
    p.appendChild(e); p.appendChild(v);
    cuerpo.appendChild(p);
  });
  d.appendChild(cuerpo);
  $('pantallaExp').insertBefore(d, $('formulario'));
}

function prellena(){
  var puestos = 0;
  for (var campo in DESDE_AGENDA){
    if (!DESDE_AGENDA.hasOwnProperty(campo)) continue;
    var v = PACIENTE[DESDE_AGENDA[campo]];
    if (!v) continue;
    v = String(v);
    if (campo === 'paciente_fecha_nacimiento'){
      v = aFechaISO(v);
      if (!v) continue;
    }
    VALORES[campo] = v; puestos++;
  }
  var n = parteNombre(PACIENTE['Paciente']);
  if (n){
    if (n.nombres){ VALORES['paciente_nombres'] = n.nombres; puestos++; }
    if (n.paterno){ VALORES['paciente_apellido_paterno'] = n.paterno; puestos++; }
    if (n.materno){ VALORES['paciente_apellido_materno'] = n.materno; puestos++; }
  }
  $('avisoPrefill').innerHTML = '<b>' + puestos + ' campos</b> se llenaron solos con los datos de ' +
    'la cita. Revisa que los <b>apellidos</b> hayan quedado bien partidos. Falta capturar a mano: ' +
    '<b>CURP</b> y <b>domicilio con calle y número</b>, que no vienen en la base.';
}

/* ---------------- dibujar un campo ---------------- */
function dibuja(c){
  var caja = document.createElement('div');
  caja.className = 'campo';

  var et = document.createElement('label');
  et.textContent = c.etiqueta || c.id;
  et.setAttribute('for', 'f_' + c.id);
  if (c.obligatorio){
    var ob = document.createElement('b'); ob.textContent = '  ·  NOM';
    et.appendChild(ob);
  }
  caja.appendChild(et);

  var ctrl;
  if (c.control === 'parrafo'){
    ctrl = document.createElement('textarea'); ctrl.rows = 3;
  } else if (c.control === 'lista' && c.opciones.length){
    ctrl = document.createElement('select');
    ctrl.appendChild(new Option('—', ''));
    c.opciones.forEach(function(o){ ctrl.appendChild(new Option(o, o)); });
  } else if (c.control === 'sino'){
    ctrl = document.createElement('div'); ctrl.className = 'sino';
    ['Sí','No'].forEach(function(o){
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = o;
      b.onclick = function(){
        var nuevo = (VALORES[c.id] === o) ? '' : o;
        pon(c.id, nuevo);
        [].forEach.call(ctrl.children, function(x){
          x.classList.toggle('on', x.textContent === nuevo);
        });
      };
      ctrl.appendChild(b);
    });
  } else if (c.control === 'casillas' && c.opciones.length){
    ctrl = document.createElement('div'); ctrl.className = 'casillas';
    c.opciones.forEach(function(o){
      var s = document.createElement('span');
      s.textContent = o;
      s.onclick = function(){
        var act = (VALORES[c.id] || '').split(' · ').filter(Boolean);
        var i = act.indexOf(o);
        if (i >= 0) act.splice(i,1); else act.push(o);
        pon(c.id, act.join(' · '));
        s.classList.toggle('on', i < 0);
      };
      ctrl.appendChild(s);
    });
  } else {
    ctrl = document.createElement('input');
    ctrl.type = c.control === 'numero' ? 'number'
              : c.control === 'fecha'  ? 'date'
              : c.control === 'hora'   ? 'time' : 'text';
    if (c.control === 'automatico') ctrl.readOnly = true;
  }

  if (ctrl.tagName === 'INPUT' || ctrl.tagName === 'TEXTAREA' || ctrl.tagName === 'SELECT'){
    ctrl.id = 'f_' + c.id;
    ctrl.addEventListener('input', function(){ pon(c.id, this.value); });
    ctrl.addEventListener('change', function(){ pon(c.id, this.value); });
    if (c.control === 'parrafo'){
      ctrl.addEventListener('input', function(){
        this.style.height = 'auto'; this.style.height = this.scrollHeight + 'px';
      });
    }
  }
  ctrl.dataset.campo = c.id;
  caja.appendChild(ctrl);

  if (c.control === 'lista' && !c.opciones.length){
    var pd = document.createElement('div'); pd.className = 'pendiente';
    pd.textContent = 'Catálogo pendiente de definir — por ahora texto libre';
    caja.appendChild(pd);
  } else if (c.notas){
    var nt = document.createElement('div'); nt.className = 'nota';
    nt.textContent = c.notas.slice(0,140);
    caja.appendChild(nt);
  }
  return caja;
}

/* ---------------- lo que se calcula solo ---------------- */
function edadDe(iso){
  var m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return '';
  var n = new Date(+m[1], +m[2]-1, +m[3]), h = new Date();
  var e = h.getFullYear() - n.getFullYear();
  var antes = (h.getMonth() < n.getMonth()) ||
              (h.getMonth() === n.getMonth() && h.getDate() < n.getDate());
  if (antes) e--;
  return (e >= 0 && e < 130) ? String(e) : '';
}

function tallaEnMetros(v){
  var n = parseFloat(String(v).replace(',','.'));
  if (!isFinite(n) || n <= 0) return null;
  if (n >= 1.2 && n <= 2.4)  return n;
  if (n >= 120 && n <= 240)  return n / 100;
  return null;
}

var CAPRINI = [
  {max:1,  riesgo:'Bajo (0-1)',
   conducta:'Movilización temprana. Compresión neumática intermitente.'},
  {max:2,  riesgo:'Moderado (2)',
   conducta:'Movilización temprana. Compresión neumática intermitente y medias antiembólicas.'},
  {max:4,  riesgo:'Alto (3-4)',
   conducta:'Lo anterior más profilaxis farmacológica: nadroparina 0.3 mL cada 24 h o enoxaparina 30 mg SC cada 24 h, iniciando 6 a 8 h después de la cirugía.'},
  {max:6,  riesgo:'Muy alto (5-6)',
   conducta:'Igual que el anterior, con profilaxis farmacológica durante 14 días.'},
  {max:999,riesgo:'Extremo (7 o más)',
   conducta:'Reducción de peso, limitar el tiempo quirúrgico y suspender la terapia de reemplazo hormonal. Enoxaparina 40 mg SC.'}
];

function calculaCaprini(){
  var pts = (ESQUEMA && ESQUEMA.puntos_caprini) || {};
  var marcados = (VALORES['caprini_factores'] || '').split(' · ').filter(Boolean);
  if (!marcados.length){
    delete VALORES['caprini_total']; delete VALORES['caprini_riesgo'];
    muestraCaprini(null, null);
    return;
  }
  var total = 0;
  marcados.forEach(function(f){ total += (pts[f] || 0); });
  var nivel = CAPRINI.filter(function(n){ return total <= n.max; })[0];
  VALORES['caprini_total']  = String(total);
  VALORES['caprini_riesgo'] = nivel.riesgo;
  ['caprini_total','caprini_riesgo'].forEach(function(id){
    var el = document.querySelector('[data-campo="' + id + '"]');
    if (el && 'value' in el) el.value = VALORES[id];
  });
  muestraCaprini(total, nivel);
}

function muestraCaprini(total, nivel){
  var el = document.querySelector('[data-campo="caprini_factores"]');
  if (!el) return;
  var caja = el.closest('.campo');
  if (!caja) return;
  var v = caja.querySelector('.conducta');
  if (total === null){ if (v) v.remove(); return; }
  if (!v){ v = document.createElement('div'); v.className = 'conducta'; caja.appendChild(v); }
  v.innerHTML = '';
  var t = document.createElement('b');
  t.textContent = total + ' puntos · riesgo ' + nivel.riesgo;
  var c = document.createElement('span'); c.textContent = nivel.conducta;
  v.appendChild(t); v.appendChild(c);
}

function recalcula(){
  var e = edadDe(VALORES['paciente_fecha_nacimiento']);
  if (e) VALORES['paciente_edad'] = e;

  var peso  = parseFloat(VALORES['sv_peso']);
  var talla = tallaEnMetros(VALORES['sv_talla']);
  if (isFinite(peso) && peso > 0 && talla) VALORES['sv_imc'] = (peso/(talla*talla)).toFixed(1);
  else delete VALORES['sv_imc'];

  var hoy = new Date();
  VALORES['doc_fecha'] = hoyISO();
  VALORES['doc_hora']  = ('0'+hoy.getHours()).slice(-2) + ':' + ('0'+hoy.getMinutes()).slice(-2);

  ['paciente_edad','sv_imc','doc_fecha','doc_hora'].forEach(function(id){
    var el = document.querySelector('[data-campo="' + id + '"]');
    if (el && 'value' in el) el.value = VALORES[id] || '';
  });

  calculaCaprini();
  avisa('sv_talla', (VALORES['sv_talla'] && !talla)
    ? 'Ese número no parece una talla. Escríbela en metros (1.70) o en centímetros (170).' : '');
  avisa('sv_peso', (isFinite(peso) && (peso < 25 || peso > 300))
    ? 'Ese peso está fuera de lo esperable. Verifícalo.' : '');
}

function avisa(id, texto){
  var el = document.querySelector('[data-campo="' + id + '"]');
  if (!el) return;
  var caja = el.closest('.campo');
  if (!caja) return;
  var v = caja.querySelector('.alerta');
  if (!texto){ if (v) v.remove(); el.style.borderColor = ''; return; }
  if (!v){ v = document.createElement('div'); v.className = 'alerta'; caja.appendChild(v); }
  v.textContent = texto;
  el.style.borderColor = 'var(--rojo)';
}

function pon(id, valor){
  if (valor === '' || valor === null || valor === undefined) delete VALORES[id];
  else VALORES[id] = valor;
  sucio = true;
  guardaBorrador();
  if (['paciente_fecha_nacimiento','sv_peso','sv_talla'].indexOf(id) >= 0) recalcula();
  if (id === 'caprini_factores') calculaCaprini();
  pinta();
}

function pinta(){
  if (!ESQUEMA || !TIPO) return;
  var delDoc = camposDe(TIPO);
  var propios = delDoc.filter(function(c){ return c.control !== 'automatico'; });
  var llenos = propios.filter(function(c){ return VALORES[c.id]; }).length;
  $('progreso').style.width = (propios.length ? (llenos/propios.length*100) : 0) + '%';

  var faltanNom = delDoc.filter(function(c){
    return c.obligatorio && c.control !== 'automatico' && !VALORES[c.id];
  }).length;
  $('estado').textContent = llenos + ' de ' + propios.length + ' campos' +
    (faltanNom ? '  ·  faltan ' + faltanNom + ' obligatorios de la NOM' : '  ·  NOM completa');

  ESQUEMA.grupos.forEach(function(g){
    var cont = document.querySelector('[data-conteo="' + g + '"]');
    if (!cont) return;
    var delGrupo = visibles(g).filter(function(c){ return c.control !== 'automatico'; });
    var n = delGrupo.filter(function(c){ return VALORES[c.id]; }).length;
    cont.textContent = n + ' / ' + delGrupo.length;
  });
}

/* Qué campos de este grupo se dibujan. El filtro grande ya lo hizo el tipo de
   documento; aquí solo se decide si además se esconde lo que ya está lleno. */
function visibles(g){
  if (!TIPO) return [];
  return camposDe(TIPO).filter(function(c){
    if (c.grupo !== g) return false;
    if (!SOLO_VALORACION) return true;
    if (CONSTANTES.hasOwnProperty(c.id)) return false;   // dato fijo, no estorba
    return !VALORES[c.id] || PENDIENTE_DICTADO[c.id];
  });
}

function arma(){
  var cont = $('formulario');
  cont.innerHTML = '';
  ESQUEMA.grupos.forEach(function(g, idx){
    var campos = visibles(g);
    if (!campos.length) return;

    var d = document.createElement('details');
    d.className = 'grupo';
    d.open = idx < 6;

    var s = document.createElement('summary');
    var fl = document.createElement('span'); fl.className = 'flecha'; fl.textContent = '▸';
    var ti = document.createElement('span'); ti.className = 'titulo'; ti.textContent = g;
    var co = document.createElement('span'); co.className = 'conteo'; co.dataset.conteo = g;
    s.appendChild(fl); s.appendChild(ti); s.appendChild(co);
    d.appendChild(s);

    var cuerpo = document.createElement('div');
    cuerpo.className = 'cuerpo';
    var i = 0;
    while (i < campos.length){
      var c = campos[i];
      var corto = ['texto','numero','fecha','hora','lista'].indexOf(c.control) >= 0;
      var sig = campos[i+1];
      var sigCorto = sig && ['texto','numero','fecha','hora','lista'].indexOf(sig.control) >= 0;
      if (corto && sigCorto){
        var par = document.createElement('div'); par.className = 'dos';
        par.appendChild(dibuja(c)); par.appendChild(dibuja(sig));
        cuerpo.appendChild(par); i += 2;
      } else {
        cuerpo.appendChild(dibuja(c)); i += 1;
      }
    }
    d.appendChild(cuerpo);
    cont.appendChild(d);
  });
  marcaPendientes();
}

function marcaPendientes(){
  Object.keys(PENDIENTE_DICTADO).forEach(function(id){
    var el = document.querySelector('[data-campo="' + id + '"]');
    if (!el) return;
    var caja = el.closest('.campo');
    if (!caja || caja.querySelector('.dictado')) return;
    var d = document.createElement('div'); d.className = 'dictado';
    var b = document.createElement('b'); b.textContent = 'Dictado: ';
    var t = document.createElement('span'); t.textContent = PENDIENTE_DICTADO[id];
    var x = document.createElement('button'); x.type = 'button'; x.textContent = 'Ya lo capturé';
    x.onclick = function(){ delete PENDIENTE_DICTADO[id]; sucio = true; guardaBorrador(); d.remove(); };
    d.appendChild(b); d.appendChild(t); d.appendChild(x);
    caja.appendChild(d);
  });
}

function vuelca(){
  Object.keys(VALORES).forEach(function(id){
    var el = document.querySelector('[data-campo="' + id + '"]');
    if (!el) return;
    if (el.classList.contains('sino')){
      [].forEach.call(el.children, function(x){
        x.classList.toggle('on', x.textContent === VALORES[id]);
      });
    } else if (el.classList.contains('casillas')){
      var act = (VALORES[id] || '').split(' · ');
      [].forEach.call(el.children, function(x){
        x.classList.toggle('on', act.indexOf(x.textContent) >= 0);
      });
    } else {
      el.value = VALORES[id];
      if (el.tagName === 'TEXTAREA'){
        el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px';
      }
    }
  });
}

function aplicaConstantes(){
  Object.keys(CONSTANTES).forEach(function(id){
    if (CONSTANTES[id]) VALORES[id] = CONSTANTES[id];
    var el = document.querySelector('[data-campo="' + id + '"]');
    if (!el) return;
    if ('value' in el){
      el.value = VALORES[id] || '';
      el.readOnly = true;
      el.title = 'Dato fijo del consultorio. Se cambia en constantes.json, no aquí.';
    }
    var caja = el.closest('.campo');
    if (caja && !caja.querySelector('.fijo')){
      var f = document.createElement('div'); f.className = 'fijo';
      f.textContent = CONSTANTES[id] ? 'Dato fijo del consultorio' : 'Dato fijo — todavía sin definir';
      caja.appendChild(f);
    }
  });
}

function cambiaAlcance(solo){
  SOLO_VALORACION = solo;
  $('modoValoracion').classList.toggle('on', solo);
  $('modoTodo').classList.toggle('on', !solo);
  try{ localStorage.setItem('alcance', solo ? 'falta' : 'todo'); }catch(e){}
  arma(); vuelca(); aplicaConstantes(); recalcula(); pinta();
}
$('modoValoracion').onclick = function(){ cambiaAlcance(true); };
$('modoTodo').onclick       = function(){ cambiaAlcance(false); };

/* ---------------- guardar ---------------- */
function cuerpoExpediente(){
  return {
    folio: FOLIO, paciente: PACIENTE, campos: VALORES,
    tipo: TIPO ? TIPO.id : '', doc_id: DOC_ID,
    fecha: hoyISO(),
    dictado_pendiente: PENDIENTE_DICTADO,
    dictado_sin_ubicar: SIN_UBICAR,
    dictado_dudas: DUDAS,
    dictado_avisos: AVISOS_ASR,
    audio_id: AUDIO_ID
  };
}

function guarda(silencioso){
  if (!FOLIO || !TIPO) return Promise.resolve();
  return pide('documentoGuardar', cuerpoExpediente())
    .then(function(d){
      sucio = false;
      DOC_ID = d.doc_id || DOC_ID;
      borraBorrador();
      refrescaEnMemoria(d);
      if (!silencioso) $('estado').textContent = 'Guardado · ' + d.guardado;
      return d;
    })
    .catch(function(e){
      $('estado').textContent = 'No pude guardar: ' + e.message +
        ' — lo capturado sigue aquí, no se perdió.';
    });
}
$('bGuardar').onclick = function(){ guarda(false); };

/* Red de seguridad: mientras no se haya guardado en la nube, lo capturado
   vive también en este navegador. Si se cae la sesión, no se pierde. */
/* Mantiene al día la copia en memoria del expediente, para que al volver al
   menú de documentos se vea lo que se acaba de guardar sin ir de nuevo al
   servidor. */
function refrescaEnMemoria(res){
  if (!EXPEDIENTE) EXPEDIENTE = { paciente: PACIENTE, documentos: [] };
  if (!EXPEDIENTE.documentos) EXPEDIENTE.documentos = [];
  var d = EXPEDIENTE.documentos.filter(function(x){ return x.id === DOC_ID; })[0];
  if (!d){ d = { id: DOC_ID }; EXPEDIENTE.documentos.push(d); }
  d.tipo = TIPO.id;
  d.fecha = hoyISO();
  d.campos = VALORES;
  d.dictado_pendiente = PENDIENTE_DICTADO;
  d.audio_id = AUDIO_ID;
  d.guardado = (res && res.guardado) || '';
  d.por = (res && res.por) || '';
}

function llaveBorrador(){ return 'borrador_' + FOLIO + '_' + (TIPO ? TIPO.id : ''); }
function guardaBorrador(){
  if (!FOLIO) return;
  try{ localStorage.setItem(llaveBorrador(), JSON.stringify(cuerpoExpediente())); }catch(e){}
}
function leeBorrador(){
  try{
    var s = localStorage.getItem(llaveBorrador());
    return s ? JSON.parse(s) : null;
  }catch(e){ return null; }
}
function borraBorrador(){
  try{ localStorage.removeItem(llaveBorrador()); }catch(e){}
}

window.addEventListener('beforeunload', function(e){
  if (sucio){ guardaBorrador(); e.preventDefault(); e.returnValue = ''; }
});
setInterval(function(){ if (sucio && CRED) guarda(true); }, 25000);

/* ============================================================
   DICTADO
   ============================================================ */
var D = { rec:null, trozos:[], t0:0, reloj:null, stream:null, ctx:null, wake:null,
          mime:'', ext:'webm', id:'', encuesta:null, propuestas:[], transcripcion:'',
          contestadas:0, total:0 };
var TROZO = 3 * 1024 * 1024;   // 3 MB de audio por parte

var MESES = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,
             septiembre:9,setiembre:9,octubre:10,noviembre:11,diciembre:12};

function iso(a,m,d){
  if (!(a>=1900 && a<=2100 && m>=1 && m<=12 && d>=1 && d<=31)) return '';
  var f = new Date(a, m-1, d);
  if (f.getFullYear() !== a || f.getMonth() !== m-1 || f.getDate() !== d) return '';
  return a + '-' + ('0'+m).slice(-2) + '-' + ('0'+d).slice(-2);
}

function fechaDeTexto(t){
  var s = sinAcentos(t);
  var m = s.match(/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{2,4})/);
  if (m){
    var a = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    var f = iso(a, +m[2], +m[1]);
    return f ? {iso:f, inferida:false} : null;
  }
  m = s.match(/(\d{1,2})\s+de\s+([a-z]+)(?:\s+(?:de\s+)?(\d{4}))?/);
  if (m && MESES[m[2]]){
    var dia = +m[1], mes = MESES[m[2]];
    if (m[3]){ var f2 = iso(+m[3], mes, dia); return f2 ? {iso:f2, inferida:false} : null; }
    var hoy = new Date(), anio = hoy.getFullYear();
    if (new Date(anio, mes-1, dia) > hoy) anio--;
    var f3 = iso(anio, mes, dia);
    return f3 ? {iso:f3, inferida:true} : null;
  }
  return null;
}

function esNegacion(texto){
  return /^(niega|sin |gesta 0|tabaquismo negado|alcoholismo negado|toxicomanias negadas|sedentaria)/
    .test(sinAcentos(texto));
}

function opcionDeCatalogo(texto, opciones){
  var s = sinAcentos(texto);
  var frases = opciones.filter(function(o){ return s.indexOf(sinAcentos(o)) >= 0; })
                       .sort(function(a,b){ return b.length - a.length; });
  if (frases.length) return frases[0];
  var mejor = null, punt = 0, empate = false;
  opciones.forEach(function(o){
    var pal = sinAcentos(o).split(/[^a-z0-9]+/).filter(function(w){ return w.length >= 4; });
    if (!pal.length) return;
    var n = pal.filter(function(w){
      return new RegExp('(^|[^a-z0-9])' + w + '([^a-z0-9]|$)').test(s);
    }).length;
    if (n === 0) return;
    if (n > punt){ punt = n; mejor = o; empate = false; }
    else if (n === punt){ empate = true; }
  });
  return (mejor && !empate) ? mejor : null;
}

function armaPropuestas(campos){
  var out = [];
  Object.keys(campos || {}).forEach(function(id){
    var c = ESQUEMA.campos.filter(function(x){ return x.id === id; })[0];
    var texto = String(campos[id] || '').trim();
    if (!texto) return;
    var p = { id:id, texto:texto, etiqueta:(c && c.etiqueta) || id,
              grupo:(c && c.grupo) || '', control:(c && c.control) || 'texto',
              actual: VALORES[id] || '', valor:'', nota:'', cabe:true, accion:'usar' };

    if (!c){ p.cabe = false; p.nota = 'Ese campo ya no existe en el diccionario.'; }
    else if (c.control === 'parrafo' || c.control === 'texto'){ p.valor = texto; }
    else if (c.control === 'fecha'){
      var f = fechaDeTexto(texto);
      if (f){
        p.valor = f.iso;
        if (f.inferida) p.nota = 'No dijo el año; supuse el más reciente. Confírmalo.';
      } else {
        p.cabe = false;
        p.nota = 'Es un campo de fecha y no encontré una fecha clara en lo dictado.';
      }
    }
    else if (c.control === 'sino'){
      if (esNegacion(texto)) p.valor = 'No';
      else { p.cabe = false; p.nota = 'Es un campo de Sí/No y lo dictado no es un sí ni un no.'; }
    }
    else if (c.control === 'lista' && c.opciones.length){
      if (esNegacion(texto) && c.opciones.indexOf('Ninguno') >= 0) p.valor = 'Ninguno';
      else {
        var o = opcionDeCatalogo(texto, c.opciones);
        if (o){ p.valor = o; p.nota = 'Del catálogo. Verifica que sea el correcto.'; }
        else { p.cabe = false; p.nota = 'Es un campo de catálogo y no reconocí ninguna opción.'; }
      }
    }
    else { p.valor = texto; }

    if (!p.cabe) p.accion = 'pendiente';
    else if (p.actual && p.actual !== p.valor) p.accion = 'conservar';
    out.push(p);
  });
  var orden = {};
  ESQUEMA.campos.forEach(function(c, i){ orden[c.id] = i; });
  out.sort(function(a,b){ return (orden[a.id]||999) - (orden[b.id]||999); });
  return out;
}

/* ---- la capa ---- */
function capaAbre(){ $('capa').classList.remove('oculto'); }
function capaCierra(){ paraGrabacion(true); $('capa').classList.add('oculto'); }
$('capaCerrar').onclick = function(){
  if (D.rec && D.rec.state === 'recording'){
    $('capaInfo').textContent = 'Detén la grabación antes de cerrar.';
    return;
  }
  capaCierra();
};
$('bDictar').onclick = function(){
  // el audio tiene que saber a qué documento pertenece, así que si esta nota
  // todavía no existe en el servidor, se guarda antes de grabar
  if (!DOC_ID){
    $('estado').textContent = 'Preparando el documento…';
    guarda(true).then(function(){ pantallaConsentimiento(); capaAbre(); });
    return;
  }
  pantallaConsentimiento(); capaAbre();
};

function pantallaConsentimiento(){
  $('capaTitulo').textContent = 'Dictar el interrogatorio';
  $('capaCuerpo').innerHTML =
    '<div class="consent">' +
    '<b>Antes de grabar.</b> El aviso de privacidad tiene un apartado para la grabación de audio ' +
    'de la consulta. Si la paciente no lo firmó, no se graba: teclea el interrogatorio y ya.' +
    '<label><input type="checkbox" id="okConsent">' +
    '<span>La paciente firmó hoy el aviso de privacidad que incluye la grabación de audio de la ' +
    'consulta, y sabe que puede pedir que se apague en cualquier momento.</span></label>' +
    '</div>' +
    '<div class="lista">' +
    '<div>· El audio lo transcribe el software del consultorio y se borra al firmar la nota.</div>' +
    '<div>· Lee las preguntas del guion tal como están; así cada respuesta cae en su campo.</div>' +
    '<div>· Al terminar te muestro campo por campo lo que entendí, antes de tocar el expediente.</div>' +
    '</div>';
  $('capaInfo').textContent = '';
  $('capaSec').classList.add('oculto');
  $('capaPri').classList.remove('oculto');
  $('capaPri').textContent = 'Empezar a grabar';
  $('capaPri').disabled = true;
  $('okConsent').onchange = function(){ $('capaPri').disabled = !this.checked; };
  $('capaPri').onclick = empiezaGrabacion;
}

function pantallaGrabando(){
  $('capaTitulo').textContent = 'Grabando';
  $('capaCuerpo').innerHTML =
    '<div class="reloj" id="reloj">0:00</div>' +
    '<div class="subreloj">Habla normal. La pantalla no se apaga.</div>' +
    '<div class="medidor"><i id="nivel"></i></div>' +
    '<div class="lista" style="margin-top:16px"><div>Orden del guion: heredofamiliares, ' +
    'personales patológicos, no patológicos, gineco-obstétricos, padecimiento actual, ' +
    'aparatos y sistemas.</div></div>';
  $('capaSec').classList.add('oculto');
  $('capaPri').classList.remove('oculto');
  $('capaPri').disabled = false;
  $('capaPri').textContent = 'Terminar y transcribir';
  $('capaPri').onclick = function(){ paraGrabacion(false); };
  $('capaInfo').textContent = '';
}

function empiezaGrabacion(){
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}})
    .then(function(stream){
      D.stream = stream;
      D.mime = ['audio/webm;codecs=opus','audio/webm','audio/mp4']
        .filter(function(m){ return window.MediaRecorder && MediaRecorder.isTypeSupported(m); })[0] || '';
      D.ext = D.mime.indexOf('mp4') >= 0 ? 'm4a' : 'webm';
      D.rec = D.mime ? new MediaRecorder(stream, {mimeType:D.mime}) : new MediaRecorder(stream);
      D.trozos = [];
      D.rec.ondataavailable = function(e){ if (e.data && e.data.size) D.trozos.push(e.data); };
      D.rec.onstop = subeAudio;
      D.rec.start(1000);
      D.t0 = Date.now();
      pantallaGrabando();
      D.reloj = setInterval(function(){
        var s = Math.floor((Date.now() - D.t0)/1000);
        var el = $('reloj');
        if (el) el.textContent = Math.floor(s/60) + ':' + ('0'+(s%60)).slice(-2);
      }, 500);
      medidor(stream);
      if (navigator.wakeLock) navigator.wakeLock.request('screen')
        .then(function(w){ D.wake = w; }).catch(function(){});
    })
    .catch(function(e){
      $('capaInfo').textContent = 'No pude usar el micrófono: ' + e.message;
    });
}

function medidor(stream){
  try{
    D.ctx = new (window.AudioContext || window.webkitAudioContext)();
    var src = D.ctx.createMediaStreamSource(stream);
    var an = D.ctx.createAnalyser(); an.fftSize = 512;
    src.connect(an);
    var buf = new Uint8Array(an.frequencyBinCount);
    (function tic(){
      if (!D.rec || D.rec.state !== 'recording') return;
      an.getByteTimeDomainData(buf);
      var pico = 0;
      for (var i=0;i<buf.length;i++){ var v = Math.abs(buf[i]-128); if (v>pico) pico=v; }
      var el = $('nivel');
      if (el) el.style.width = Math.min(100, pico/128*260) + '%';
      requestAnimationFrame(tic);
    })();
  }catch(e){}
}

function paraGrabacion(cancelar){
  if (D.reloj){ clearInterval(D.reloj); D.reloj = null; }
  if (D.wake){ try{ D.wake.release(); }catch(e){} D.wake = null; }
  if (D.ctx){ try{ D.ctx.close(); }catch(e){} D.ctx = null; }
  if (D.rec && D.rec.state === 'recording'){
    if (cancelar) D.rec.onstop = function(){};
    D.rec.stop();
  }
  if (D.stream){ D.stream.getTracks().forEach(function(t){ t.stop(); }); D.stream = null; }
}

function base64De(blob){
  return new Promise(function(ok, mal){
    var r = new FileReader();
    r.onload = function(){
      var s = String(r.result);
      ok(s.slice(s.indexOf(',') + 1));
    };
    r.onerror = function(){ mal(new Error('No pude leer el audio.')); };
    r.readAsDataURL(blob);
  });
}

/* El audio sube partido: una consulta larga no cabe en una sola petición. */
function subeAudio(){
  var blob = new Blob(D.trozos, {type: D.mime || 'audio/webm'});
  var partes = Math.max(1, Math.ceil(blob.size / TROZO));
  var mb = (blob.size/1048576).toFixed(1);

  $('capaTitulo').textContent = 'Subiendo el audio';
  $('capaCuerpo').innerHTML =
    '<div class="reloj" id="pct">0%</div>' +
    '<div class="subreloj" id="paso">Preparando…</div>' +
    '<div class="medidor"><i id="avance"></i></div>' +
    '<div class="lista" style="margin-top:16px">' +
    '<div>Audio de ' + mb + ' MB, en ' + partes + ' partes.</div>' +
    '<div>Puedes cerrar esta ventana y seguir tecleando: la Mac del consultorio lo recoge y ' +
    'te aviso cuando la transcripción esté lista.</div></div>';
  $('capaSec').classList.add('oculto');
  $('capaPri').classList.remove('oculto');
  $('capaPri').disabled = false;
  $('capaPri').textContent = 'Seguir capturando mientras tanto';
  $('capaPri').onclick = function(){ $('capa').classList.add('oculto'); };

  function avance(pct, texto){
    if ($('pct')) $('pct').textContent = Math.round(pct) + '%';
    if ($('paso')) $('paso').textContent = texto;
    if ($('avance')) $('avance').style.width = pct + '%';
    $('estado').textContent = 'Dictado: ' + texto;
  }

  pide('audioIniciar', { folio: FOLIO, doc_id: DOC_ID, ext: D.ext, partes: partes,
                         paciente: PACIENTE['Paciente'] || '' })
    .then(function(d){
      D.id = d.id;
      AUDIO_ID = d.id;
      var n = 0;
      function siguiente(){
        if (n >= partes) return pide('audioListo', { id: D.id });
        var trozo = blob.slice(n * TROZO, Math.min(blob.size, (n+1) * TROZO));
        return base64De(trozo)
          .then(function(b64){ return pide('audioParte', { id: D.id, n: n+1, datos: b64 }); })
          .then(function(){
            n++;
            avance(n / partes * 100, 'subiendo parte ' + n + ' de ' + partes);
            return siguiente();
          });
      }
      avance(2, 'subiendo parte 1 de ' + partes);
      return siguiente();
    })
    .then(function(){
      avance(100, 'en cola, esperando a la Mac');
      D.encuesta = setInterval(consulta, 15000);
      consulta();
    })
    .catch(function(e){
      $('capaCuerpo').innerHTML = '';
      var l = document.createElement('div'); l.className = 'lista';
      l.textContent = 'No pude subir el audio: ' + e.message;
      $('capaCuerpo').appendChild(l);
      $('estado').textContent = 'El dictado no se pudo subir.';
    });
}

function consulta(){
  if (!D.id) return;
  pide('audioEstado', { id: D.id })
    .then(function(t){
      var leyenda = { 'subiendo':'subiendo', 'pendiente':'en cola, esperando a la Mac',
                      'transcribiendo':'la Mac está transcribiendo', 'listo':'listo',
                      'error':'falló', 'borrado':'borrado' }[t.estado] || t.estado;
      $('estado').textContent = 'Dictado: ' + leyenda;
      if ($('paso')) $('paso').textContent = leyenda;

      if (t.estado === 'error'){
        clearInterval(D.encuesta); D.encuesta = null;
        capaAbre();
        $('capaTitulo').textContent = 'La transcripción falló';
        $('capaCuerpo').innerHTML = '';
        var l = document.createElement('div'); l.className = 'lista';
        l.textContent = String(t.detalle || 'Sin detalle.');
        $('capaCuerpo').appendChild(l);
        $('capaSec').classList.add('oculto');
        $('capaPri').textContent = 'Cerrar';
        $('capaPri').onclick = capaCierra;
        return;
      }
      if (t.estado !== 'listo') return;

      clearInterval(D.encuesta); D.encuesta = null;
      return pide('expedienteLeer', { folio: FOLIO }).then(function(g){
        EXPEDIENTE = (g.existe && g.expediente) || EXPEDIENTE;
        var docs = (EXPEDIENTE && EXPEDIENTE.documentos) || [];
        var doc = docs.filter(function(x){ return x.id === DOC_ID; })[0] || {};
        ofreceDictadoListo(doc.dictado || {}, doc.transcripcion || '');
      });
    })
    .catch(function(){});
}

function ofreceDictadoListo(dic, transcripcion){
  D.propuestas = armaPropuestas(dic.campos || {});
  SIN_UBICAR = dic.sin_ubicar || [];
  DUDAS = dic.dudas || [];
  AVISOS_ASR = dic.avisos || [];
  D.transcripcion = transcripcion;
  D.contestadas = dic.contestadas || 0;
  D.total = dic.total || 0;
  capaAbre();
  pintaRevision();
}

function pintaRevision(){
  $('capaTitulo').textContent = 'Revisa antes de que entre al expediente';
  var c = $('capaCuerpo');
  c.innerHTML = '';

  var enc = document.createElement('div');
  enc.className = 'lista';
  enc.innerHTML = '<div>Contestó <b>' + D.contestadas + ' de ' + D.total + '</b> preguntas del ' +
    'guion. Lo que no se preguntó se queda vacío: el programa no escribe "niega" por una ' +
    'pregunta que nadie hizo.</div>';
  c.appendChild(enc);

  var caben = D.propuestas.filter(function(p){ return p.cabe; });
  var nocaben = D.propuestas.filter(function(p){ return !p.cabe; });

  if (caben.length){
    c.appendChild(titulo('Lo que puedo llenar solo (' + caben.length + ')'));
    caben.forEach(function(p){ c.appendChild(filaPropuesta(p)); });
  }
  if (nocaben.length){
    c.appendChild(titulo('Esto lo tienes que teclear tú (' + nocaben.length + ')'));
    nocaben.forEach(function(p){ c.appendChild(filaPropuesta(p)); });
  }
  [['Avisos de la transcripción', AVISOS_ASR],
   ['Palabras dudosas', DUDAS],
   ['No supe dónde ponerlo', SIN_UBICAR]].forEach(function(par){
    if (!par[1] || !par[1].length) return;
    c.appendChild(titulo(par[0] + ' (' + par[1].length + ')'));
    var caja = document.createElement('div'); caja.className = 'lista';
    par[1].forEach(function(x){
      var d = document.createElement('div'); d.textContent = '· ' + x; caja.appendChild(d);
    });
    c.appendChild(caja);
  });

  c.appendChild(titulo('Transcripción corregida'));
  var pre = document.createElement('pre'); pre.className = 'tx';
  pre.textContent = D.transcripcion || '(vacía)';
  c.appendChild(pre);

  $('capaSec').classList.remove('oculto');
  $('capaSec').textContent = 'No usar nada';
  $('capaSec').onclick = capaCierra;
  $('capaPri').classList.remove('oculto');
  $('capaPri').disabled = false;
  $('capaPri').onclick = aplicaPropuestas;
  cuentaRevision();
}

function titulo(t){
  var h = document.createElement('div'); h.className = 'seccion'; h.textContent = t;
  return h;
}

function filaPropuesta(p){
  var f = document.createElement('div'); f.className = 'fila';
  var g = document.createElement('div'); g.className = 'qgrupo'; g.textContent = p.grupo;
  var e = document.createElement('div'); e.className = 'qcampo'; e.textContent = p.etiqueta;
  f.appendChild(g); f.appendChild(e);

  var d = document.createElement('div'); d.className = 'qdictado';
  d.textContent = (p.cabe && p.valor !== p.texto) ? p.valor + '   ←   «' + p.texto + '»' : p.texto;
  f.appendChild(d);

  if (p.actual){
    var a = document.createElement('div'); a.className = 'qactual';
    a.textContent = 'Ya tenías: ' + p.actual;
    f.appendChild(a);
  }
  if (p.nota){
    var n = document.createElement('div'); n.className = 'qnota'; n.textContent = p.nota;
    f.appendChild(n);
  }

  var ops = document.createElement('div'); ops.className = 'ops';
  var elegibles = p.cabe
    ? (p.actual ? [['usar','Reemplazar'],['agregar','Agregar al final'],
                   ['conservar','Dejar lo que tenía'],['descartar','Descartar']]
                : [['usar','Usar'],['descartar','Descartar']])
    : [['pendiente','Dejarlo anotado en el campo'],['descartar','Descartar']];
  elegibles.forEach(function(par){
    var b = document.createElement('button'); b.type = 'button'; b.textContent = par[1];
    b.classList.toggle('on', p.accion === par[0]);
    b.onclick = function(){
      p.accion = par[0];
      [].forEach.call(ops.children, function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      f.classList.toggle('descartada', p.accion === 'descartar' || p.accion === 'conservar');
      cuentaRevision();
    };
    ops.appendChild(b);
  });
  f.appendChild(ops);
  f.classList.toggle('descartada', p.accion === 'descartar' || p.accion === 'conservar');
  return f;
}

function cuentaRevision(){
  var n = D.propuestas.filter(function(p){
    return p.accion === 'usar' || p.accion === 'agregar'; }).length;
  var m = D.propuestas.filter(function(p){ return p.accion === 'pendiente'; }).length;
  $('capaInfo').textContent = n + ' campos se llenan' + (m ? '  ·  ' + m + ' quedan anotados' : '');
  $('capaPri').textContent = n ? 'Pasar al expediente' : 'Pasar solo las anotaciones';
}

function aplicaPropuestas(){
  D.propuestas.forEach(function(p){
    if (p.accion === 'usar'){
      VALORES[p.id] = p.valor; delete PENDIENTE_DICTADO[p.id];
    } else if (p.accion === 'agregar'){
      VALORES[p.id] = (p.actual + ' ' + p.valor).trim(); delete PENDIENTE_DICTADO[p.id];
    } else if (p.accion === 'pendiente'){
      PENDIENTE_DICTADO[p.id] = p.texto;
    }
  });
  sucio = true;
  arma(); vuelca(); aplicaConstantes(); recalcula(); pinta();
  guarda(false);
  capaCierra();
  var primero = D.propuestas.filter(function(p){
    return p.accion === 'usar' || p.accion === 'agregar' || p.accion === 'pendiente'; })[0];
  if (primero){
    var el = document.querySelector('[data-campo="' + primero.id + '"]');
    if (el){
      var det = el.closest('details');
      if (det) det.open = true;
      el.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }
}
